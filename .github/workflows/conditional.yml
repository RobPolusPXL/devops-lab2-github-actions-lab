name: Exercise 3 - Conditional
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  show-env:
    runs-on: ubuntu-latest
    steps:
      - name: Show choice
        run: echo "Gekozen ${{ inputs.environment }}"
      - name: Development
        if: inputs.environment == 'development'
        run: echo "Dit is development"
      - name: Staging
        if: inputs.environment == 'staging'
        run: echo "Dit is staging"
      - name: Production
        if: inputs.environment == 'production'
        run: echo "Dit is production"
