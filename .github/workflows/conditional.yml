name: Exercise 3 - Conditional
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  show-env:
    runs-on: ubuntu-latest
    steps:
      - name: Show environment
        run: echo "Gekozen ${{ inputs.environment }}"
      - name: Production
        if: inputs.environment == 'production'
        run: echo "Deploying to production!"
      - name: Test mode
        if: inputs.environment == 'development' || inputs.environment == 'staging'
        run: echo "Running in test mode"
