name: Uses Examples
on: workflow_dispatch

jobs:
  use-uses:
    runs-on: ubuntu-latest
    steps:
      - name: Use checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13' 
      - run: python my_script.py
